name: CI & Deploy

# Every push and pull request runs the checks. Pushes to main additionally deploy to the webspace via
# FTP over TLS – but only once the DEPLOY_* repository variables and secrets are configured (see CLAUDE.md → Deployment).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Third-party actions are pinned to a commit, so a moved tag can't change what runs next to the deploy secrets. Update
# them deliberately: the commit of a release tag, with its version as a comment.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PHP_VERSION: '8.3' # lowest supported version; keep in sync with composer.json config.platform.php
  NODE_VERSION: '24'

jobs:
  backend:
    name: Backend (PHP ${{ matrix.php }}${{ matrix.database == 'mariadb' && ', MariaDB' || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        database: [sqlite]
        # Production runs MySQL/MariaDB: run the suite there once, on the lowest supported PHP version.
        include:
          - php: '8.3'
            database: mariadb
    services:
      mariadb:
        # An empty image skips the service, so only the MariaDB entry starts it.
        image: ${{ matrix.database == 'mariadb' && 'mariadb:11' || '' }}
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: timelion_test
          MARIADB_USER: timelion
          MARIADB_PASSWORD: timelion
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      # Empty means in-memory SQLite (tests/TestDatabase.php).
      TIMELION_TEST_DSN: ${{ matrix.database == 'mariadb' && 'mysql:host=127.0.0.1;port=3306;dbname=timelion_test;charset=utf8mb4' || '' }}
      TIMELION_TEST_DB_USER: timelion
      TIMELION_TEST_DB_PASSWORD: timelion
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-${{ matrix.php }}-

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Audit production dependencies
        if: matrix.php == env.PHP_VERSION && matrix.database == 'sqlite'
        run: composer audit --no-dev

      - name: Code style
        if: matrix.php == env.PHP_VERSION && matrix.database == 'sqlite'
        run: composer cs

      - name: Static analysis
        if: matrix.php == env.PHP_VERSION && matrix.database == 'sqlite'
        run: composer stan

      - name: Tests
        run: composer test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Only "dependencies" ship in index.html (svelte); dev tools never reach the browser.
      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Format, type check, test and build
        run: npm run verify

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Builds the frontend, then runs Playwright against PHP's built-in server (frontend/e2e/server.mjs).
      - name: End-to-end tests
        working-directory: frontend
        run: npm run e2e

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  deploy:
    name: Deploy
    needs: [backend, frontend, e2e]
    # Repository-level variables only: environment-level variables are not visible in a job's `if`.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      # Secrets, so the public Actions logs mask them. Secrets can't gate the job, so `if` checks DEPLOY_URL.
      DEPLOY_FTP_HOST: ${{ secrets.DEPLOY_FTP_HOST }}
      DEPLOY_FTP_USER: ${{ secrets.DEPLOY_FTP_USER }}
      DEPLOY_FTP_PORT: ${{ vars.DEPLOY_FTP_PORT || '21' }}
      DEPLOY_FTP_PATH: ${{ vars.DEPLOY_FTP_PATH }}
      DEPLOY_FTP_CA_FILE: /etc/ssl/certs/ca-certificates.crt
      DEPLOY_URL: ${{ vars.DEPLOY_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2

      # A fixed root version keeps the commit hash out of vendor/composer/installed.php, so vendor/ changes only with
      # its contents and deploy-ftp.sh can skip uploading it.
      - name: Install production dependencies
        env:
          COMPOSER_ROOT_VERSION: dev-main
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader --classmap-authoritative

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Assemble release
        run: |
          mkdir -p release/var
          cp -R .htaccess bin migrations public src vendor config.example.php release/
          test -f release/.htaccess
          test -f release/public/index.html
          test -f release/public/.htaccess

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends lftp

      # The webspace offers FTP only, so migrations run through a one-time-token endpoint instead of bin/migrate.php.
      - name: Upload release and run migrations
        env:
          LFTP_PASSWORD: ${{ secrets.DEPLOY_FTP_PASSWORD }}
        run: bash .github/scripts/deploy-ftp.sh release

      - name: Smoke test
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 5 "${DEPLOY_URL%/}/api/health" | grep -q '"status":"ok"'
          curl --fail --silent --show-error "${DEPLOY_URL%/}/" | grep -q '<div id="app">'
          # Nothing outside public/ is reachable: a file in the app root gets the single-page app, not its own content.
          curl --fail --silent --show-error "${DEPLOY_URL%/}/config.example.php" | grep -q '<div id="app">'
          # security.txt (RFC 9116) comes from the release, as UTF-8 text.
          curl --fail --silent --show-error --dump-header "$RUNNER_TEMP/security-txt-headers" \
            "${DEPLOY_URL%/}/.well-known/security.txt" | grep -q '^Contact: https://'
          grep -qi '^content-type: text/plain; *charset=utf-8' "$RUNNER_TEMP/security-txt-headers"
