name: CI & Deploy

# Every push and pull request runs the checks. Pushes to main additionally deploy to the webspace via
# FTP over TLS – but only once the DEPLOY_* repository variables and secrets are configured (see CLAUDE.md → Deployment).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PHP_VERSION: '8.3' # lowest supported version; keep in sync with composer.json config.platform.php
  NODE_VERSION: '24'

jobs:
  backend:
    name: Backend (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-${{ matrix.php }}-

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Code style
        if: matrix.php == env.PHP_VERSION
        run: composer cs

      - name: Static analysis
        if: matrix.php == env.PHP_VERSION
        run: composer stan

      - name: Tests
        run: composer test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Format, type check, test and build
        run: npm run verify

  deploy:
    name: Deploy
    needs: [backend, frontend]
    # Repository-level variables only: environment-level variables are not visible in a job's `if`.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      # Secrets, so the public Actions logs mask them. Secrets can't gate the job, so `if` checks DEPLOY_URL.
      DEPLOY_FTP_HOST: ${{ secrets.DEPLOY_FTP_HOST }}
      DEPLOY_FTP_USER: ${{ secrets.DEPLOY_FTP_USER }}
      DEPLOY_FTP_PORT: ${{ vars.DEPLOY_FTP_PORT || '21' }}
      DEPLOY_FTP_PATH: ${{ vars.DEPLOY_FTP_PATH }}
      DEPLOY_FTP_CA_FILE: /etc/ssl/certs/ca-certificates.crt
      DEPLOY_URL: ${{ vars.DEPLOY_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2

      - name: Install production dependencies
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader --classmap-authoritative

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Assemble release
        run: |
          mkdir -p release/var
          cp -R bin migrations public src vendor config.example.php release/
          test -f release/public/index.html
          test -f release/public/.htaccess

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends lftp

      # The webspace offers FTP only, so migrations run through a one-time-token endpoint instead of bin/migrate.php.
      - name: Upload release and run migrations
        env:
          LFTP_PASSWORD: ${{ secrets.DEPLOY_FTP_PASSWORD }}
        run: bash .github/scripts/deploy-ftp.sh release

      - name: Smoke test
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 5 "${DEPLOY_URL%/}/api/health" | grep -q '"status":"ok"'
          curl --fail --silent --show-error "${DEPLOY_URL%/}/" | grep -q '<div id="app">'
